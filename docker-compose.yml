services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "54328:5432"
    environment:
      POSTGRES_USER: tirani
      POSTGRES_PASSWORD: tirani-local
      POSTGRES_DB: tirani_develop
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tirani -d tirani_develop"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
